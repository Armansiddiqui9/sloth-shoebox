<section class="block" id="download">
  <div class="wrap">
    <div class="head"><h2>Your gallery, now on Windows.</h2></div>
    <div class="sheet">
      <div class="two two--tape" style="padding: clamp(1rem, 3vw, 2rem);">
        <div>
          <h3 class="cap">{{ c.DOWNLOAD_LEDE }}</h3>
          <p class="muted">{{ c.DOWNLOAD_NOTES }}</p>
        </div>
        <div>
          <p class="cap">Download</p>
          <a class="btn btn--solid" href="{{ c.DOWNLOAD_BUTTON[1] }}">{{ c.DOWNLOAD_BUTTON[0] }}</a>
          <p class="fine">A test build — run <code>cargo tauri build</code> in <code>app-windows/</code> after installing Rust.</p>
        </div>
      </div>
    </div>
  </div>
</section>
